name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: iOS
            os: macos-latest
            target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    # iOS on GitHub runners is currently broken by a genuine upstream bug:
    # CMake computes CMAKE_APPLE_ARCH_SYSROOTS as [iPhoneOS SDK;
    # iPhoneSimulator SDK] against Xcode 26's SDK layout, then rejects it as
    # a length mismatch against the single-arch (arm64) CMAKE_OSX_ARCHITECTURES
    # during fmt's compiler-flag check. Confirmed via
    # github.com/geode-sdk/build-geode-mod/issues/45 (open, unresolved
    # upstream) and by reproducing it locally against every Xcode 26.0-26.6
    # point release currently on the runner image (not version-specific) and
    # against an explicit -DCMAKE_OSX_SYSROOT=iphoneos override (no effect -
    # CMAKE_APPLE_ARCH_SYSROOTS isn't actually derived from that variable).
    # Allowed to fail so releases still ship the other four platforms; will
    # self-heal once fixed upstream in CMake or build-geode-mod.
    continue-on-error: ${{ matrix.config.name == 'iOS' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload universal .geode
        uses: actions/upload-artifact@v4
        with:
          name: jeevin.level-link.geode
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.build-output }}/*.geode
          generate_release_notes: true
