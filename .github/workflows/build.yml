name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: iOS
            os: macos-latest
            target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    # iOS is still allowed to fail: the workaround below is our best current
    # guess at the actual upstream bug (confirmed via
    # github.com/geode-sdk/build-geode-mod/issues/45, still open/unresolved
    # upstream, and reproduced locally against every Xcode 26.0-26.6 point
    # release - it's not version-specific). If it turns out not to fully
    # fix it, releases should still ship the other four platforms.
    continue-on-error: ${{ matrix.config.name == 'iOS' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # iOS-only: recent CMake defaults CMAKE_OSX_SYSROOT to *both* the
          # iPhoneOS and iPhoneSimulator SDK paths when CMAKE_SYSTEM_NAME=iOS
          # is set without an explicit sysroot, then rejects that 2-entry
          # list as a length mismatch against the single-arch (arm64)
          # CMAKE_OSX_ARCHITECTURES during fmt's compiler-flag check. Forcing
          # a single sysroot here pre-empts that auto-detection - this input
          # is appended after the action's own -DGEODE_TARGET_PLATFORM=iOS,
          # so it wins on the CMake command line for other platforms too
          # (empty string here is a no-op).
          configure-args: ${{ matrix.config.name == 'iOS' && '-DCMAKE_OSX_SYSROOT=iphoneos' || '' }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload universal .geode
        uses: actions/upload-artifact@v4
        with:
          name: jeevin.level-link.geode
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.build-output }}/*.geode
          generate_release_notes: true
